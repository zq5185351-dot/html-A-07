<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saylani Admission Form</title>
</head>
<body>

    <h1>Saylani Mass IT Training (SMIT)</h1>
    <h2>Admission Form</h2>

    <form action="#" method="POST" enctype="multipart/form-data">

        <!-- Personal Details -->
        <fieldset>
            <legend><strong>Personal Information</strong></legend>
            <br>

            <label for="fullName">Student's Full Name:</label><br>
            <input type="text" id="fullName" name="fullName" placeholder="Enter your full name" required><br><br>

            <label for="fatherName">Father's Name:</label><br>
            <input type="text" id="fatherName" name="fatherName" placeholder="Enter father's name" required><br><br>

            <label for="email">Email Address:</label><br>
            <input type="email" id="email" name="email" placeholder="example@gmail.com" required><br><br>

            <label for="phone">Phone Number:</label><br>
            <input type="tel" id="phone" name="phone" placeholder="0300-1234567" required><br><br>

            <label for="dob">Date of Birth:</label><br>
            <input type="date" id="dob" name="dob" required><br><br>

            <label>Gender:</label><br>
            <input type="radio" id="male" name="gender" value="male" required>
            <label for="male">Male</label>
            <input type="radio" id="female" name="gender" value="female">
            <label for="female">Female</label>
            <input type="radio" id="other" name="gender" value="other">
            <label for="other">Other</label><br><br>

            <label for="cnic">CNIC / B-Form Number:</label><br>
            <input type="text" id="cnic" name="cnic" placeholder="42101-1234567-1" required><br><br>
        </fieldset>

        <br>

        <!-- Academic & Course Details -->
        <fieldset>
            <legend><strong>Course & Qualification</strong></legend>
            <br>

            <label for="course">Course Selection:</label><br>
            <select id="course" name="course" required>
                <option value="" disabled selected>-- Select Course --</option>
                <option value="web-development">Web & Mobile App Development</option>
                <option value="graphic-design">Graphic Design</option>
                <option value="python">Python Programming</option>
                <option value="ai-chatbot">AI & Chatbot Development</option>
                <option value="ccna">CCNA Networking</option>
            </select><br><br>

            <label for="city">City:</label><br>
            <select id="city" name="city" required>
                <option value="" disabled selected>-- Select City --</option>
                <option value="karachi">Karachi</option>
                <option value="lahore">Lahore</option>
                <option value="islamabad">Islamabad</option>
                <option value="faisalabad">Faisalabad</option>
                <option value="rawalpindi">Rawalpindi</option>
            </select><br><br>

            <label for="qualification">Qualification:</label><br>
            <select id="qualification" name="qualification" required>
                <option value="" disabled selected>-- Select Qualification --</option>
                <option value="matric">Matriculation / O-Level</option>
                <option value="intermediate">Intermediate / A-Level</option>
                <option value="undergraduate">Undergraduate (Bachelor's)</option>
                <option value="graduate">Graduate (Master's)</option>
            </select><br><br>
        </fieldset>

        <br>

        <!-- Address & Document Upload -->
        <fieldset>
            <legend><strong>Address & Documents</strong></legend>
            <br>

            <label for="address">Address:</label><br>
            <textarea id="address" name="address" rows="4" cols="50" placeholder="Enter your full residential address..." required></textarea><br><br>

            <label for="picture">Upload Picture / File:</label><br>
            <input type="file" id="picture" name="picture" accept="image/*,.pdf" required><br><br>
        </fieldset>

        <br>

        <!-- Form Actions -->
        <input type="submit" value="Submit Admission Form">
        <input type="reset" value="Clear Form">

    </form>

</body>
</html>
